name: Daily AI news brief

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. Two entries plus the timezone guard handle UK daylight saving.
    - cron: "0 6 * * *"
    - cron: "0 7 * * *"

concurrency:
  group: daily-news-brief
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Select the 07:00 Europe/London invocation
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(TZ=Europe/London date +%H)" = "07" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.lock
      - if: steps.gate.outputs.run == 'true'
        run: pytest
      - if: steps.gate.outputs.run == 'true'
        run: PYTHONPATH=src python -m news_brief.cli validate
      - run: PYTHONPATH=src python -m news_brief.cli generate
        if: steps.gate.outputs.run == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Commit brief and state
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add briefs reports state.json
          git diff --cached --quiet || git commit -m "brief: daily AI news $(date +%F)"
          git push
      - if: steps.gate.outputs.run == 'true'
        run: PYTHONPATH=src python -m news_brief.cli build
      - uses: actions/configure-pages@v5
        if: steps.gate.outputs.run == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.gate.outputs.run == 'true'
        with:
          path: site
      - id: deployment
        if: steps.gate.outputs.run == 'true'
        uses: actions/deploy-pages@v4
