name: Daily AI news brief

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Optional first UTC date to generate (YYYY-MM-DD)"
        required: false
        type: string
      end_date:
        description: "Optional last UTC date to generate (YYYY-MM-DD); defaults to start_date"
        required: false
        type: string
  schedule:
    # GitHub cron is UTC. Two entries plus the timezone guard handle UK daylight saving.
    - cron: "0 6 * * *"
    - cron: "0 7 * * *"

concurrency:
  group: daily-news-brief
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Select the 07:00 Europe/London invocation
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(TZ=Europe/London date +%H)" = "07" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.lock
      - if: steps.gate.outputs.run == 'true'
        run: pytest
      - if: steps.gate.outputs.run == 'true'
        run: PYTHONPATH=src python -m news_brief.cli validate
      - name: Generate daily brief or requested backfill
        if: steps.gate.outputs.run == 'true'
        run: |
          if [ -n "$BACKFILL_START" ]; then
            BACKFILL_END="${BACKFILL_END:-$BACKFILL_START}"
            if ! date -d "$BACKFILL_START" +%F >/dev/null || ! date -d "$BACKFILL_END" +%F >/dev/null || [ "$BACKFILL_START" \> "$BACKFILL_END" ]; then
              echo "start_date and end_date must be YYYY-MM-DD, with start_date no later than end_date"
              exit 1
            fi
            run_day="$BACKFILL_START"
            while [ "$run_day" \< "$BACKFILL_END" ] || [ "$run_day" = "$BACKFILL_END" ]; do
              PYTHONPATH=src python -m news_brief.cli generate --date "$run_day" --force
              run_day="$(date -I -d "$run_day + 1 day")"
            done
          else
            PYTHONPATH=src python -m news_brief.cli generate
          fi
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BACKFILL_START: ${{ inputs.start_date }}
          BACKFILL_END: ${{ inputs.end_date }}
      - name: Commit brief and state
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add briefs reports state.json
          git diff --cached --quiet || git commit -m "brief: daily AI news $(date +%F)"
          git push
      - if: steps.gate.outputs.run == 'true'
        run: PYTHONPATH=src python -m news_brief.cli build
      - uses: actions/configure-pages@v5
        if: steps.gate.outputs.run == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.gate.outputs.run == 'true'
        with:
          path: site
      - id: deployment
        if: steps.gate.outputs.run == 'true'
        uses: actions/deploy-pages@v4
